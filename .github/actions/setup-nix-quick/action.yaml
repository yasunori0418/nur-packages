name: "Setup Nix (quick install)"
description: "Install Nix quickly via nix-quick-install-action (no Cachix; for the plan job)"
inputs:
  nix-access-token:
    description: "GitHub PAT for Nix to fetch from GitHub (falls back to github.token)"
    required: false
runs:
  using: "composite"
  steps:
    - name: Install Nix
      uses: nixbuild/nix-quick-install-action@e0ea8f6061c766e5c1d927cea8be769a1c5108a9 # v36
      with:
        github_access_token: ${{ inputs.nix-access-token || github.token }}
        nix_conf: |
          max-jobs = auto
